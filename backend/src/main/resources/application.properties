spring.application.name=gestion

# --- Variables de entorno ---
# "optional:" = si no existe (por ejemplo en produccion), no falla: las variables llegan por el sistema.
# "[.properties]" = le indica a Spring que lea el .env con formato de .properties.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# --- Base de datos ---
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# Hibernate solo verifica que las entidades coincidan con las tablas; nunca modifica el esquema.
# El esquema lo crea y lo cambia unicamente Flyway.
spring.jpa.hibernate.ddl-auto=validate
# Cierra la conexion a la base al terminar el servicio, no al terminar de armar la respuesta.
spring.jpa.open-in-view=false

# --- Flyway ---
# Migraciones en src/main/resources/db/migration (ubicación por defecto).